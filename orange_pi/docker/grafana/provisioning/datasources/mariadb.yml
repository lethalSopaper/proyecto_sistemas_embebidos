apiVersion: 1

datasources:
  - name: MariaDB GPS
    type: mysql
    uid: mariadb-gps
    access: proxy
    url: mariadb:3306
    database: ${MARIADB_DATABASE}
    user: ${MARIADB_USER}
    secureJsonData:
      password: $MARIADB_PASSWORD
    jsonData:
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
    isDefault: true
    editable: false
