apiVersion: 1

datasources:
  - name: InfluxDB GPS
    type: influxdb
    uid: influxdb-gps
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: ${INFLUXDB_ORG}
      defaultBucket: ${INFLUXDB_BUCKET}
      tlsSkipVerify: false
    secureJsonData:
      token: $INFLUXDB_TOKEN
    isDefault: false
    editable: false
