version: "3.8"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  nodered:
    image: nodered/node-red:latest
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - ./nodered:/data
    depends_on:
      - mosquitto
      - influxdb
      - mariadb

  influxdb:
    image: influxdb:2
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:?Define INFLUXDB_USERNAME en .env}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:?Define INFLUXDB_PASSWORD en .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-proyecto}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-gps}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?Define INFLUXDB_TOKEN en .env}
    volumes:
      - ./influxdb:/var/lib/influxdb2

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Define MARIADB_ROOT_PASSWORD en .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-gps}
      MARIADB_USER: ${MARIADB_USER:-gps_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Define MARIADB_PASSWORD en .env}
    volumes:
      - ./mariadb:/var/lib/mysql
      - ./mariadb-init:/docker-entrypoint-initdb.d:ro

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana:/var/lib/grafana
    depends_on:
      - influxdb
      - mariadb
